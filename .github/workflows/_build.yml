# Reusable build: restore → build → test, optionally pack. Callers: ci.yml, publish.yml.
name: build

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version band to install
        type: string
        required: false
        default: "10.0.x"
      pack:
        description: Pack NuGet packages (publish flow)
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer derives versions from git tags and their height.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore MessagingToolbox.slnx

      - name: Build
        run: dotnet build MessagingToolbox.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MessagingToolbox.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/test-results.trx"
          retention-days: 7

      - name: Pack
        if: ${{ inputs.pack }}
        # Packs every IsPackable project — today only MessagingToolbox.Aspire.Hosting; the
        # Abstractions package joins by flipping IsPackable, no workflow change (DevOps §7).
        run: dotnet pack MessagingToolbox.slnx --configuration Release --no-build --output artifacts

      - name: Upload packages
        if: ${{ inputs.pack }}
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
