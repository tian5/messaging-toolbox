# Three ecosystems, weekly, grouped into one PR each to keep noise low (DevOps §9).
# The nuget entry understands central package management and targets Directory.Packages.props.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - "*"
